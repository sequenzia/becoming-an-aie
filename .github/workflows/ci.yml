name: CI
# Every action is pinned to a commit SHA with its version tag in the comment. F resolved the SHAs on
# 2026-09-16 with: gh api repos/<owner>/<repo>/git/ref/tags/<tag> (each ref was a commit object).
#   actions/checkout@v6             d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-node@v6           249970729cb0ef3589644e2896645e5dc5ba9c38
#   actions/upload-artifact@v5      330a01c490aca151604b8cf639adc76d48f6c5d4
#   docker/setup-buildx-action@v3   8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/build-push-action@v6     10e90e3645eae34f1e60eeb005ba3a3d33f178e8
# The integrator resolved the next one on 2026-10-09 the same way (the ref was a commit object):
#   astral-sh/setup-uv@v10.2.0      c18668ad3cf93ea998bef934396af7bb5c839dc7
# The web job builds with PREVIEW_DRAFTS=true so the end-to-end run reaches the fixture module (blueprint
# section 12.3). The image job builds the Dockerfile with the Phase 1 default FEATURE_ACCOUNTS=true and smoke
# tests the result. It pushes nowhere until the author confirms the registry (docs/decisions.md, open item 3).
# Blueprint section 12.4. The labs job runs the Python checks of the three optional labs under labs/, one matrix
# leg per lab, with no API key: the live steps are never run in CI (docs/research/labs.md section 4.2).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: node scripts/lint.mjs
      - name: Content check
        run: npm run content:check
      - name: Type check (runs astro sync, validates content schemas)
        run: npx astro check --minimumSeverity error
      - name: Unit and component tests
        run: npm test
      - name: Build with draft preview for end-to-end tests
        # Drafts render in this build and never in an image (docs/decisions.md, decision 5). The keyboard spec,
        # the a11y spec, and the landing spec all run against it; /modules/models exists only here.
        run: npm run build
        env:
          PREVIEW_DRAFTS: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: End to end and accessibility
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: axe-reports
          path: axe-reports/
          retention-days: 30

  image:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: becoming-an-aie:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Warn when the SITE_URL repository variable is unset
        if: ${{ vars.SITE_URL == '' }}
        run: |
          echo "::warning title=SITE_URL is unset::The repository variable SITE_URL is not set. The image is built with SITE_URL=http://localhost:4321, which is right for the smoke test and wrong for a deployment. Set the variable under Settings, Secrets and variables, Actions, Variables before this image is deployed."
      - name: Note when the FEATURE_ACCOUNTS repository variable overrides the default
        if: ${{ vars.FEATURE_ACCOUNTS != '' }}
        run: |
          echo "::notice title=FEATURE_ACCOUNTS is set::The repository variable FEATURE_ACCOUNTS=${{ vars.FEATURE_ACCOUNTS }} overrides the Phase 1 default (true). A value of false builds a Phase 0 image with no sign-in. Remove the variable once the Phase 1 image is the one deployed (docs/decisions.md, open item 15)."
      - name: Build the image (loaded into the runner's Docker, pushed nowhere)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          # Phase 1 onward ships with accounts on (blueprint section 1.3), the same default the Dockerfile and
          # the astro:env schema carry. The repository variable FEATURE_ACCOUNTS still overrides it; the Phase 0
          # image was built with the variable set to false.
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'http://localhost:4321' }}
            FEATURE_ACCOUNTS=${{ vars.FEATURE_ACCOUNTS || 'true' }}
          tags: ${{ env.IMAGE }}
      - name: Smoke test the image as OpenShift runs it (arbitrary UID, read-only root filesystem)
        run: |
          # NOTIFY_TOKEN_SECRET is a placeholder so the subscribe handler gets past requireEnv and reaches
          # getDb(); DATABASE_URL stays unset on purpose, and so do the auth values. Nothing here is a real secret.
          docker run -d --name aie --read-only --tmpfs /tmp --user 12345:0 -p 8080:8080 \
            -e NOTIFY_TOKEN_SECRET=ci-smoke-placeholder-token-not-real-000000 "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          # Without DATABASE_URL the pod is not ready. With accounts on, the five auth values are missing too, and
          # the log names every one of them (src/lib/env.ts missingRequiredEnv). /healthz alone cannot see this.
          test "$(status /readyz)" = 503
          # Prerendered pages come from the static handler and need no database: the landing page and, from
          # Phase 1, the orientation module (blueprint section 1.3: the deployed site shows orientation only).
          test "$(status /)" = 200
          test "$(status /modules/orientation)" = 200
          # The build flag. The Phase 0 image answered 404 for /sign-in; an image built with FEATURE_ACCOUNTS=true
          # routes it. The page itself needs the database, because the session middleware asks Better Auth for the
          # session on every on-demand request (src/middleware.ts), so here it is a 500 and on a deployed pod a 200.
          test "$(status /sign-in)" != 404
          # A form POST fails closed. The session middleware runs before the action handler
          # (astro/dist/core/routing/handler.js, actionsAndPages inside handleMiddleware) and getAuth() opens the
          # database, so a pod without DATABASE_URL answers 500 with an empty body (Astro renders no body when no
          # 500 route exists) before the handler runs. An image built with FEATURE_ACCOUNTS=false skips that branch
          # and the handler's own fail-closed path answers 503 with the generic sentence
          # (docs/decisions.md, 2026-10-03). Either way nothing is stored, no variable name reaches the body, and
          # the log names the cause.
          : > /tmp/notify.html
          post_status=$(curl -s -o /tmp/notify.html -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:8080' --data 'email=smoke@example.com' \
            'http://127.0.0.1:8080/notify?_action=notifySubscribe')
          case "$post_status" in
            500) ;;
            503) grep -q 'Something went wrong on our side' /tmp/notify.html ;;
            *) echo "unexpected status $post_status for the subscribe POST"; exit 1 ;;
          esac
          ! grep -q 'DATABASE_URL' /tmp/notify.html
          ! grep -qi 'stored your address' /tmp/notify.html
          docker logs aie
          docker logs aie 2>&1 | grep -q 'DATABASE_URL is not set'
          docker rm -f aie
          # The runtime install carries no optional packages: the embedded database is absent from the image.
          docker run --rm --read-only --tmpfs /tmp --user 12345:0 "$IMAGE" \
            node -e "import('@electric-sql/pglite').then(() => process.exit(1), () => process.exit(0))"
          # npm must run under the same constraints. Without DATABASE_URL the TLS check exits 2 by design.
          set +e
          docker run --rm --read-only --tmpfs /tmp --user 12345:0 "$IMAGE" npm run db:tls-check
          code=$?
          set -e
          test "$code" -eq 2

  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lab: [models-first-measurable-feature, tools-tool-contract, evals-first-grader]
    defaults:
      run:
        working-directory: labs/${{ matrix.lab }}
    env:
      # Every uv command fails instead of rewriting uv.lock, so a stale lock fails the job. No secret and no
      # provider key is set: run.py --dry-run prints the plan and makes no model call.
      UV_LOCKED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The uv version the labs were built and checked with (docs/dependencies.md). Python 3.12 comes from
          # each lab's .python-version.
          version: '0.11.7'
          working-directory: labs/${{ matrix.lab }}
      - name: Adapter copies are identical
        run: sh ../check_adapter_copies.sh
      - name: Install the lab
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Dry run
        run: uv run python run.py --dry-run
