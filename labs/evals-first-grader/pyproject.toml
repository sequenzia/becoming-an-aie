[project]
name = "evals-first-grader"
version = "0.1.0"
description = "Optional lab for the Verification and evals module: review outputs and write a first grader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.13.0",
    "openai==3.27.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ANN", "SIM", "C4", "PT", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
